name: Build and Publish Docker Image

# Triggers:
#   - push of a version tag (v0.1.0, v0.2.0, etc.) → build + push to GHCR
#   - manual workflow_dispatch → useful for testing without tagging
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fleetswarm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # required for GHCR push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Multi-arch is essential — Umbrel runs on both Raspberry Pi (arm64)
      # and Umbrel Home / x86 boxes (amd64). Pin both at once.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR auth uses the auto-provisioned GITHUB_TOKEN — no secrets to manage
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pattern derives from the git tag:
      #   git tag v0.1.0 → Docker tags 0.1.0 and latest
      - name: Extract version from git tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print the digest so it can be copied into the Umbrel compose file
      - name: Output multi-arch digest
        run: |
          echo "==============================================================="
          echo "  Multi-arch digest (paste into Umbrel docker-compose.yml):"
          echo ""
          echo "    image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}"
          echo ""
          echo "==============================================================="
